<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IdeaShel Vale · Ideas por voz</title>
  <meta name="description" content="Capture sus ideas por voz y organícelas. Funciona sin internet y todo queda guardado en su teléfono.">
  <meta name="theme-color" content="#F6F4FF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14111F" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="IdeaShel Vale">
  <meta name="application-name" content="IdeaShel Vale">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img src="icons/favicon.svg" alt="" width="34" height="34">
        <span class="brand-name">IdeaShel Vale</span>
      </div>
      <span id="offlinePill" class="pill pill-offline" hidden>Sin conexión</span>
    </header>

    <div id="banner" class="banner" hidden></div>

    <main>
      <!-- IDEAS -->
      <section id="view-ideas" class="view active" aria-label="Ideas">
        <div class="card capture">
          <div id="voiceArea" class="voice-area">
            <button id="recBtn" class="rec-btn" type="button" aria-label="Grabar idea por voz" aria-pressed="false">
              <svg class="ic-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Z"/><path d="M18.5 11.5a6.5 6.5 0 0 1-13 0M12 18v3.5M8.5 21.5h7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
              <svg class="ic-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></svg>
            </button>
            <p id="recHint" class="rec-hint">Toque para grabar su idea</p>
          </div>
          <p id="voiceUnavailable" class="notice" hidden></p>
          <label class="sr-only" for="newText">Nueva idea</label>
          <textarea id="newText" rows="3" placeholder="Escriba su idea… o toque el 🎤 del teclado para dictar. Use #etiquetas si quiere."></textarea>
          <div class="capture-row">
            <label class="sr-only" for="newCategory">Categoría</label>
            <select id="newCategory" class="select"></select>
            <button id="saveNewBtn" class="btn primary" type="button">Guardar idea</button>
          </div>
        </div>

        <div class="searchbar">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <label class="sr-only" for="search">Buscar ideas</label>
            <input id="search" type="search" placeholder="Buscar ideas…" enterkeyhint="search" autocomplete="off">
          </div>
          <button id="filterBtn" class="icon-btn" type="button" aria-label="Filtros y orden">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span id="filterDot" class="dot" hidden></span>
          </button>
        </div>
        <div id="catChips" class="chips" aria-label="Filtrar por categoría"></div>
        <div id="activeFilters" class="active-filters"></div>
        <div id="ideaList" class="idea-list"></div>
        <div id="emptyState" class="empty" hidden></div>
      </section>

      <!-- EXPLORAR -->
      <section id="view-explore" class="view" aria-label="Explorar"></section>

      <!-- AJUSTES -->
      <section id="view-settings" class="view" aria-label="Ajustes"></section>
    </main>

    <nav class="tabbar" aria-label="Secciones">
      <button type="button" data-view="ideas" class="active" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3h9A2.5 2.5 0 0 1 19 5.5v7A2.5 2.5 0 0 1 16.5 15H11l-4.2 3.6c-.5.4-1.3 0-1.2-.7L6 15h-.5A.5.5 0 0 1 5 14.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Ideas</span>
      </button>
      <button type="button" data-view="explore">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M19 16.5c.15 1.6.9 2.35 2.5 2.5-1.6.15-2.35.9-2.5 2.5-.15-1.6-.9-2.35-2.5-2.5 1.6-.15 2.35-.9 2.5-2.5Z" fill="currentColor"/></svg>
        <span>Explorar</span>
      </button>
      <button type="button" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Ajustes</span>
      </button>
    </nav>
  </div>

  <div id="sheetRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>

  <noscript><p style="padding:24px">IdeaShel Vale necesita JavaScript activado.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
