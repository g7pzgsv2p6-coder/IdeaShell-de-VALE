<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IdeaShel Vale · Ideas por voz</title>
  <meta name="description" content="Capture sus ideas por voz y organícelas. Funciona sin internet y todo queda guardado en su teléfono.">
  <meta name="theme-color" content="#FFF6FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1424" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="IdeaShel Vale">
  <meta name="application-name" content="IdeaShel Vale">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="topMenuBtn" class="icon-btn ghost-icon" type="button" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="brand">
        <img src="icons/favicon.svg" alt="" width="30" height="30">
        <span class="brand-name">IdeaShel Vale</span>
      </div>

    </header>

    <div id="banner" class="banner" hidden></div>

    <main>
      <!-- INICIO: el plan primero -->
      <section id="view-home" class="view active" aria-label="Inicio"></section>

      <!-- Encabezado compartido por Ideas, Tareas, Tablero y Plan -->
      <div class="home-head" id="homeHead">
        <h1 id="greeting" class="greeting">Hola</h1>
        <p id="homeSub" class="home-sub"></p>
        <div class="home-tabs" role="tablist" aria-label="Vistas">
          <button type="button" role="tab" data-tab="ideas" aria-selected="true">Ideas</button>
          <button type="button" role="tab" data-tab="tasks" aria-selected="false">Tareas</button>
          <button type="button" role="tab" data-tab="board" aria-selected="false">Tablero</button>
          <button type="button" role="tab" data-tab="plan" aria-selected="false">Plan</button>
        </div>
      </div>

      <!-- IDEAS -->
      <section id="view-ideas" class="view" aria-label="Ideas">
        <!-- Barra de captura: escribir o grabar -->
    <div id="composer" class="composer">
      <div class="composer-extra" id="composerExtra">
        <label class="sr-only" for="newCategory">Categoría</label>
        <select id="newCategory" class="select small-select"></select>
        <button id="saveNewBtn" class="btn primary small" type="button">Guardar idea</button>
      </div>
      <div class="composer-row">
        <button id="tplBtn" class="tpl-btn" type="button" aria-label="Crear desde una plantilla">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <label class="sr-only" for="newText">Nueva idea</label>
        <textarea id="newText" rows="1" placeholder="Escriba o dicte su idea…"></textarea>
        <button id="recBtn" class="rec-btn" type="button" aria-label="Grabar idea por voz">
          <svg class="ic-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Z"/><path d="M18.5 11.5a6.5 6.5 0 0 1-13 0M12 18v3.5M8.5 21.5h7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
        <p id="voiceUnavailable" class="notice" hidden></p>
        <div id="todayPanel" class="today" hidden></div>

        <div class="searchbar">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <label class="sr-only" for="search">Buscar ideas</label>
            <input id="search" type="search" placeholder="Buscar ideas…" enterkeyhint="search" autocomplete="off">
          </div>
<button id="viewToggle" class="icon-btn" type="button" aria-label="Cambiar a vista de lista">
        <svg class="ic-grid" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="7" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="15" width="7" height="5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="12" width="7" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <svg class="ic-list" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="14" width="16" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
          <button id="filterBtn" class="icon-btn" type="button" aria-label="Filtros y orden">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span id="filterDot" class="dot" hidden></span>
          </button>
        </div>
        <div id="catChips" class="chips" aria-label="Filtrar por categoría"></div>
        <div id="activeFilters" class="active-filters"></div>
        <div id="ideaList" class="idea-list"></div>
        <div id="emptyState" class="empty" hidden></div>
      </section>

      <!-- TAREAS -->
      <section id="view-tasks" class="view" aria-label="Tareas"></section>

      <!-- TABLERO -->
      <section id="view-board" class="view" aria-label="Tablero"></section>

      <!-- PLAN DE TRABAJO -->
      <section id="view-plan" class="view" aria-label="Plan de trabajo"></section>

      <!-- EXPLORAR -->
      <section id="view-explore" class="view" aria-label="Explorar"></section>

      <!-- AJUSTES -->
      <section id="view-settings" class="view" aria-label="Ajustes"></section>
    </main>

    <!-- Barra inferior: Plan primero, grabación al centro -->
    <nav class="tabbar2" aria-label="Secciones">
      <button type="button" class="t2" data-nav="home" aria-label="Plan (inicio)">
        <span class="t2i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8 2.8v3M16 2.8v3M8 11h8M8 15h5"/></svg></span><span>Plan</span>
      </button>
      <button type="button" class="t2" data-nav="agenda" aria-label="Agenda del plan">
        <span class="t2i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span><span>Agenda</span>
      </button>
      <button type="button" class="t2rec" data-nav="record" aria-label="Grabar">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Z"/><path d="M18.5 11.5a6.5 6.5 0 0 1-13 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="t2" data-nav="ideas" aria-label="Ideas">
        <span class="t2i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3h9A2.5 2.5 0 0 1 19 5.5v7a2.5 2.5 0 0 1-2.5 2.5H11l-4 3.5V15h-.5A1.5 1.5 0 0 1 5 13.5Z"/></svg></span><span>Ideas</span>
      </button>
      <button type="button" class="t2" data-nav="more" id="menuBtn" aria-label="Más opciones" aria-expanded="false">
        <span class="t2i"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg></span><span>Más</span>
      </button>
    </nav>

  </div>

  <span id="offlinePill" class="pill pill-offline" hidden>Sin conexión</span>
  <div id="sheetRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <audio id="player" preload="metadata" hidden></audio>

  <noscript><p style="padding:24px">IdeaShel Vale necesita JavaScript activado.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
